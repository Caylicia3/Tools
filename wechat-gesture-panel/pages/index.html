<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微信手势控制面板</title>
    <style id="theme-vars">
/* WeChat Gesture Panel — low-saturation cool palette */

:root {
  --gest-background: #f2f5f7;
  --gest-foreground: #1f2937;

  --gest-card: rgba(255, 255, 255, 0.86);
  --gest-card-solid: #ffffff;
  --gest-card-foreground: #1f2937;

  --gest-popover: #ffffff;
  --gest-popover-foreground: #1f2937;

  --gest-primary: #6e9aa8;
  --gest-primary-foreground: #ffffff;
  --gest-primary-subtle: rgba(110, 154, 168, 0.12);

  --gest-muted: #e8eef2;
  --gest-muted-foreground: #6b7b85;

  --gest-border: #d6dee3;
  --gest-input: #d6dee3;
  --gest-ring: #6e9aa8;

  --gest-success: #7db39a;
  --gest-warning: #d4b27a;
  --gest-error: #c98b8b;
  --gest-info: #6e9aa8;

  --gest-bg: #f2f5f7;
  --gest-surface: rgba(255, 255, 255, 0.86);
  --gest-surface-2: rgba(255, 255, 255, 0.96);
  --gest-ink: #1f2937;
  --gest-ink-2: #4b5563;
  --gest-ink-3: #6b7b85;
  --gest-line: #d6dee3;

  --gest-radius-sm: 4px;
  --gest-radius-md: 10px;
  --gest-radius-lg: 16px;
  --gest-radius-pill: 999px;

  --gest-shadow-1: 0 1px 2px rgba(15, 23, 42, 0.04), 0 1px 1px rgba(15, 23, 42, 0.02);
  --gest-shadow-2: 0 8px 24px -8px rgba(15, 23, 42, 0.14);
  --gest-shadow-3: 0 24px 60px -20px rgba(15, 23, 42, 0.22);

  --gest-font-sans: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --gest-font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}

html {
  font-family: var(--gest-font-sans);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--gest-background);
    --color-foreground: var(--gest-foreground);
    --color-card: var(--gest-card);
    --color-card-foreground: var(--gest-card-foreground);
    --color-popover: var(--gest-popover);
    --color-popover-foreground: var(--gest-popover-foreground);
    --color-primary: var(--gest-primary);
    --color-primary-foreground: var(--gest-primary-foreground);
    --color-muted: var(--gest-muted);
    --color-muted-foreground: var(--gest-muted-foreground);
    --color-border: var(--gest-border);
    --color-input: var(--gest-input);
    --color-ring: var(--gest-ring);
    --radius-sm: var(--gest-radius-sm);
    --radius-md: var(--gest-radius-md);
    --radius-lg: var(--gest-radius-lg);
  }
  @layer base {
    body { background: var(--gest-background); color: var(--gest-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--gest-background); }
      .text-background { color: var(--gest-background); }
      .border-background { border-color: var(--gest-background); }
      .ring-background { --tw-ring-color: var(--gest-background); }
      .bg-foreground { background-color: var(--gest-foreground); }
      .text-foreground { color: var(--gest-foreground); }
      .border-foreground { border-color: var(--gest-foreground); }
      .ring-foreground { --tw-ring-color: var(--gest-foreground); }
      .bg-card { background-color: var(--gest-card); }
      .text-card { color: var(--gest-card); }
      .border-card { border-color: var(--gest-card); }
      .ring-card { --tw-ring-color: var(--gest-card); }
      .bg-card-foreground { background-color: var(--gest-card-foreground); }
      .text-card-foreground { color: var(--gest-card-foreground); }
      .border-card-foreground { border-color: var(--gest-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--gest-card-foreground); }
      .bg-popover { background-color: var(--gest-popover); }
      .text-popover { color: var(--gest-popover); }
      .border-popover { border-color: var(--gest-popover); }
      .ring-popover { --tw-ring-color: var(--gest-popover); }
      .bg-popover-foreground { background-color: var(--gest-popover-foreground); }
      .text-popover-foreground { color: var(--gest-popover-foreground); }
      .border-popover-foreground { border-color: var(--gest-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--gest-popover-foreground); }
      .bg-primary { background-color: var(--gest-primary); }
      .text-primary { color: var(--gest-primary); }
      .border-primary { border-color: var(--gest-primary); }
      .ring-primary { --tw-ring-color: var(--gest-primary); }
      .bg-primary-foreground { background-color: var(--gest-primary-foreground); }
      .text-primary-foreground { color: var(--gest-primary-foreground); }
      .border-primary-foreground { border-color: var(--gest-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--gest-primary-foreground); }
      .bg-muted { background-color: var(--gest-muted); }
      .text-muted { color: var(--gest-muted); }
      .border-muted { border-color: var(--gest-muted); }
      .ring-muted { --tw-ring-color: var(--gest-muted); }
      .bg-muted-foreground { background-color: var(--gest-muted-foreground); }
      .text-muted-foreground { color: var(--gest-muted-foreground); }
      .border-muted-foreground { border-color: var(--gest-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--gest-muted-foreground); }
      .bg-border { background-color: var(--gest-border); }
      .text-border { color: var(--gest-border); }
      .border-border { border-color: var(--gest-border); }
      .ring-border { --tw-ring-color: var(--gest-border); }
      .bg-input { background-color: var(--gest-input); }
      .text-input { color: var(--gest-input); }
      .border-input { border-color: var(--gest-input); }
      .ring-input { --tw-ring-color: var(--gest-input); }
      .bg-ring { background-color: var(--gest-ring); }
      .text-ring { color: var(--gest-ring); }
      .border-ring { border-color: var(--gest-ring); }
      .ring-ring { --tw-ring-color: var(--gest-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body>
  <style id="critical-layout">
    :root {
      --gest-video-bg: #0f1419;
      --gest-subtitle-bg: rgba(0, 0, 0, 0.55);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
    }
    body {
      display: grid;
      grid-template-rows: 1fr auto;
      background: var(--gest-video-bg);
      color: var(--gest-foreground);
    }
    .video-mockup {
      position: relative;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(ellipse at 30% 20%, rgba(30, 41, 51, 0.9) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 80%, rgba(20, 30, 40, 0.9) 0%, transparent 50%),
        var(--gest-video-bg);
      overflow: hidden;
    }
    .gesture-panel {
      position: absolute;
      top: 16px;
      right: 16px;
      max-width: 180px;
      width: max-content;
      z-index: 10;
      background: var(--gest-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--gest-border);
      border-radius: var(--gest-radius-md);
      box-shadow: var(--gest-shadow-2);
    }
    .subtitle-bar {
      grid-row: 2;
      background: var(--gest-subtitle-bg);
    }
    @media (max-width: 360px) {
      .gesture-panel {
        top: 12px;
        right: 12px;
        max-width: 164px;
      }
    }
  </style>
  <main>
    <section class="video-mockup" aria-label="视频通话界面">
      <div class="gesture-panel" role="region" aria-label="手势控制面板">
        <div class="camera-status flex items-center gap-2 px-3 py-2">
          <i data-lucide="video" class="w-4 h-4 text-[var(--gest-ink-2)]"></i>
          <span class="w-2 h-2 rounded-full bg-[var(--gest-success)]" aria-hidden="true"></span>
          <span class="text-xs text-[var(--gest-ink-2)]">摄像头 · 开启</span>
        </div>
        <div class="h-px bg-[var(--gest-line)] mx-3" role="separator"></div>
        <div class="current-gesture flex items-center gap-2 px-3 py-2">
          <i data-lucide="hand" class="w-5 h-5 text-[var(--gest-ink)]"></i>
          <span class="text-xs text-[var(--gest-ink-2)]">当前手势</span>
          <span class="text-sm font-medium text-[var(--gest-primary)] ml-auto">滑动</span>
        </div>
        <div class="action-chips flex flex-wrap gap-1.5 px-3 pb-3 pt-1">
          <span class="px-2 py-1 text-xs rounded-full bg-[var(--gest-muted)] text-[var(--gest-ink-2)]">打开</span>
          <span class="px-2 py-1 text-xs rounded-full bg-[var(--gest-muted)] text-[var(--gest-ink-2)]">选中</span>
          <span class="px-2 py-1 text-xs rounded-full bg-[var(--gest-primary)] text-[var(--gest-primary-foreground)]">滚动</span>
        </div>
      </div>
    </section>
    <div class="subtitle-bar px-4 py-3 text-center">
      <p class="text-sm text-white/90">这里显示视频字幕，面板不会遮挡此区域</p>
    </div>
  </main>
  <script>lucide.createIcons();</script>
</body>
</html>
