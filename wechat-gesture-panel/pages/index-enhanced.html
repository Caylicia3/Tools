<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微信手势控制面板 - 增强版</title>
    <style id="theme-vars">
/* WeChat Gesture Panel — low-saturation cool palette */

:root {
  --gest-background: #f2f5f7;
  --gest-foreground: #1f2937;

  --gest-card: rgba(255, 255, 255, 0.86);
  --gest-card-solid: #ffffff;
  --gest-card-foreground: #1f2937;

  --gest-popover: #ffffff;
  --gest-popover-foreground: #1f2937;

  --gest-primary: #6e9aa8;
  --gest-primary-foreground: #ffffff;
  --gest-primary-subtle: rgba(110, 154, 168, 0.12);

  --gest-muted: #e8eef2;
  --gest-muted-foreground: #6b7b85;

  --gest-border: #d6dee3;
  --gest-input: #d6dee3;
  --gest-ring: #6e9aa8;

  --gest-success: #7db39a;
  --gest-warning: #d4b27a;
  --gest-error: #c98b8b;
  --gest-info: #6e9aa8;

  --gest-bg: #f2f5f7;
  --gest-surface: rgba(255, 255, 255, 0.86);
  --gest-surface-2: rgba(255, 255, 255, 0.96);
  --gest-ink: #1f2937;
  --gest-ink-2: #4b5563;
  --gest-ink-3: #6b7b85;
  --gest-line: #d6dee3;

  --gest-radius-sm: 4px;
  --gest-radius-md: 10px;
  --gest-radius-lg: 16px;
  --gest-radius-pill: 999px;

  --gest-shadow-1: 0 1px 2px rgba(15, 23, 42, 0.04), 0 1px 1px rgba(15, 23, 42, 0.02);
  --gest-shadow-2: 0 8px 24px -8px rgba(15, 23, 42, 0.14);
  --gest-shadow-3: 0 24px 60px -20px rgba(15, 23, 42, 0.22);

  --gest-font-sans: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --gest-font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}

html {
  font-family: var(--gest-font-sans);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--gest-background);
    --color-foreground: var(--gest-foreground);
    --color-card: var(--gest-card);
    --color-card-foreground: var(--gest-card-foreground);
    --color-popover: var(--gest-popover);
    --color-popover-foreground: var(--gest-popover-foreground);
    --color-primary: var(--gest-primary);
    --color-primary-foreground: var(--gest-primary-foreground);
    --color-muted: var(--gest-muted);
    --color-muted-foreground: var(--gest-muted-foreground);
    --color-border: var(--gest-border);
    --color-input: var(--gest-input);
    --color-ring: var(--gest-ring);
    --radius-sm: var(--gest-radius-sm);
    --radius-md: var(--gest-radius-md);
    --radius-lg: var(--gest-radius-lg);
  }
  @layer base {
    body { background: var(--gest-background); color: var(--gest-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>

</head>
<body class="min-h-screen font-sans antialiased">
  <style id="critical-layout">
    :root {
      --gest-video-bg: #0f1419;
      --gest-subtitle-bg: rgba(0, 0, 0, 0.55);
      --gest-overlay: rgba(15, 23, 42, 0.62);
      --gest-spotlight-ring: rgba(255, 255, 255, 0.45);
      --gest-gradient-1: rgba(30, 41, 51, 0.9);
      --gest-gradient-2: rgba(20, 30, 40, 0.9);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
    }
    body {
      display: grid;
      grid-template-rows: 1fr auto;
      background: var(--gest-video-bg);
      color: var(--gest-foreground);
    }
    .video-mockup {
      position: relative;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(ellipse at 30% 20%, var(--gest-gradient-1) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 80%, var(--gest-gradient-2) 0%, transparent 50%),
        var(--gest-video-bg);
      overflow: hidden;
    }
    .gesture-panel {
      position: absolute;
      top: 16px;
      right: 16px;
      max-width: 196px;
      width: max-content;
      z-index: 10;
      background: var(--gest-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--gest-border);
      border-radius: var(--gest-radius-md);
      box-shadow: var(--gest-shadow-2);
      touch-action: none;
      user-select: none;
      will-change: transform;
    }
    .gesture-panel.is-dragging {
      box-shadow: var(--gest-shadow-3);
    }
    .drag-handle {
      width: 32px;
      height: 4px;
      border-radius: var(--gest-radius-pill);
      background: var(--gest-ink-3);
      opacity: 0.4;
      margin: 8px auto 4px;
      cursor: grab;
      pointer-events: none;
    }
    .gesture-panel:active .drag-handle {
      cursor: grabbing;
    }
    .subtitle-bar {
      grid-row: 2;
      background: var(--gest-subtitle-bg);
    }
    .replay-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 6px 8px;
      font-size: 12px;
      line-height: 1.25;
      color: var(--gest-primary);
      background: transparent;
      border: 1px solid color-mix(in srgb, var(--gest-primary) 30%, transparent);
      border-radius: var(--gest-radius-sm);
      cursor: pointer;
      transition: background-color 0.15s ease;
    }
    .replay-btn:hover {
      background: var(--gest-primary-subtle);
    }
    .onboarding-overlay {
      position: absolute;
      inset: 0;
      z-index: 30;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .onboarding-overlay.is-active {
      display: flex;
    }
    .spotlight-ring {
      position: absolute;
      z-index: 31;
      border-radius: var(--gest-radius-md);
      box-shadow: 0 0 0 4px var(--gest-spotlight-ring), 0 0 0 9999px var(--gest-overlay);
      background: transparent;
      pointer-events: none;
      opacity: 0;
      transition: all 0.25s ease;
    }
    .spotlight-ring.is-active {
      opacity: 1;
    }
    .onboarding-card {
      position: relative;
      z-index: 32;
      width: 100%;
      max-width: 272px;
      background: var(--gest-card-solid);
      border-radius: var(--gest-radius-lg);
      box-shadow: var(--gest-shadow-3);
      padding: 16px;
    }
    @media (max-width: 360px) {
      .gesture-panel {
        top: 12px;
        right: 12px;
        max-width: 180px;
      }
    }
  </style>
  <main>
    <section class="video-mockup" aria-label="视频通话界面" id="videoMockup">
      <div class="gesture-panel" id="gesturePanel" role="region" aria-label="手势控制面板">
        <div class="drag-handle" aria-label="拖动把手" role="button" tabindex="0"></div>
        <div class="camera-status flex items-center gap-2 px-3 py-2">
          <i data-lucide="video" class="w-4 h-4 text-[var(--gest-ink-2)]"></i>
          <span class="w-2 h-2 rounded-full bg-[var(--gest-success)]" aria-hidden="true"></span>
          <span class="text-xs text-[var(--gest-ink-2)]">摄像头 · 开启</span>
        </div>
        <div class="h-px bg-[var(--gest-line)] mx-3" role="separator"></div>
        <div class="current-gesture flex items-center gap-2 px-3 py-2">
          <i data-lucide="hand" class="w-5 h-5 text-[var(--gest-ink)]"></i>
          <span class="text-xs text-[var(--gest-ink-2)]">当前手势</span>
          <span class="text-sm font-medium text-[var(--gest-primary)] ml-auto">滑动</span>
        </div>
        <div class="action-chips flex flex-wrap gap-1.5 px-3 pb-3 pt-1" id="actionChips">
          <span class="px-2 py-1 text-xs rounded-full bg-[var(--gest-muted)] text-[var(--gest-ink-2)]">打开</span>
          <span class="px-2 py-1 text-xs rounded-full bg-[var(--gest-muted)] text-[var(--gest-ink-2)]">选中</span>
          <span class="px-2 py-1 text-xs rounded-full bg-[var(--gest-primary)] text-[var(--gest-primary-foreground)]">滚动</span>
        </div>
        <div class="gesture-help px-3 py-2 border-t border-[var(--gest-line)]" id="gestureHelp">
          <p class="text-xs font-medium text-[var(--gest-ink-2)] mb-2">手势说明</p>
          <div class="space-y-1.5">
            <div class="flex items-center gap-2 text-xs text-[var(--gest-ink-2)]">
              <i data-lucide="arrow-up-down" class="w-4 h-4 text-[var(--gest-primary)]"></i>
              <span class="text-[var(--gest-ink-3)]">上下挥动</span>
              <span class="ml-auto">滚动</span>
            </div>
            <div class="flex items-center gap-2 text-xs text-[var(--gest-ink-2)]">
              <i data-lucide="hand-metal" class="w-4 h-4 text-[var(--gest-primary)]"></i>
              <span class="text-[var(--gest-ink-3)]">握拳</span>
              <span class="ml-auto">选中</span>
            </div>
            <div class="flex items-center gap-2 text-xs text-[var(--gest-ink-2)]">
              <i data-lucide="hand" class="w-4 h-4 text-[var(--gest-primary)]"></i>
              <span class="text-[var(--gest-ink-3)]">张开手</span>
              <span class="ml-auto">打开</span>
            </div>
          </div>
        </div>
        <div class="px-3 pb-3 pt-1">
          <button type="button" id="replayOnboarding" class="replay-btn">
            <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
            重新引导
          </button>
        </div>
      </div>

      <div class="onboarding-overlay" id="onboardingOverlay" aria-hidden="true">
        <div class="spotlight-ring" id="spotlightRing"></div>
        <div class="onboarding-card">
          <p class="text-sm font-medium text-[var(--gest-ink)] mb-1" id="onboardingTitle">欢迎使用手势面板</p>
          <p class="text-xs text-[var(--gest-ink-2)] leading-relaxed mb-4" id="onboardingText">...</p>
          <div class="flex items-center justify-end gap-2">
            <button type="button" id="onboardingSkip" class="px-3 py-1.5 text-xs rounded-md text-[var(--gest-ink-3)] hover:bg-[var(--gest-muted)] transition-colors">跳过</button>
            <button type="button" id="onboardingNext" class="px-3 py-1.5 text-xs rounded-md bg-[var(--gest-primary)] text-[var(--gest-primary-foreground)] hover:opacity-90 transition-opacity">下一步</button>
          </div>
        </div>
      </div>
    </section>
    <div class="subtitle-bar px-4 py-3 text-center">
      <p class="text-sm text-[var(--gest-primary-foreground)]">这里显示视频字幕，面板不会遮挡此区域</p>
    </div>
  </main>
  <script>
    (function () {
      // Draggable panel
      const panel = document.getElementById('gesturePanel');
      const mockup = document.getElementById('videoMockup');
      let isDragging = false;
      let startX = 0, startY = 0;
      let baseX = 0, baseY = 0;

      function getBounds() {
        const mockRect = mockup.getBoundingClientRect();
        const panelRect = panel.getBoundingClientRect();
        const style = getComputedStyle(panel);
        const initialTop = parseFloat(style.top) || 0;
        const initialRight = parseFloat(style.right) || 0;
        const initialLeft = mockRect.width - panelRect.width - initialRight;
        return {
          minX: -initialLeft,
          maxX: initialRight,
          minY: -initialTop,
          maxY: mockRect.height - panelRect.height - initialTop
        };
      }

      function setTranslate(x, y, scale) {
        const s = scale ? ' scale(1.02)' : '';
        panel.style.transform = 'translate3d(' + x + 'px, ' + y + 'px, 0)' + s;
      }

      function clamp(val, min, max) {
        return Math.max(min, Math.min(max, val));
      }

      panel.addEventListener('pointerdown', function (e) {
        isDragging = true;
        panel.classList.add('is-dragging');
        panel.setPointerCapture(e.pointerId);
        startX = e.clientX;
        startY = e.clientY;
        setTranslate(baseX, baseY, true);
      });

      panel.addEventListener('pointermove', function (e) {
        if (!isDragging) return;
        e.preventDefault();
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        const bounds = getBounds();
        const x = clamp(baseX + dx, bounds.minX, bounds.maxX);
        const y = clamp(baseY + dy, bounds.minY, bounds.maxY);
        setTranslate(x, y, true);
      });

      panel.addEventListener('pointerup', function (e) {
        if (!isDragging) return;
        isDragging = false;
        panel.classList.remove('is-dragging');
        panel.releasePointerCapture(e.pointerId);
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        const bounds = getBounds();
        baseX = clamp(baseX + dx, bounds.minX, bounds.maxX);
        baseY = clamp(baseY + dy, bounds.minY, bounds.maxY);
        setTranslate(baseX, baseY, false);
      });

      panel.addEventListener('pointercancel', function () {
        if (!isDragging) return;
        isDragging = false;
        panel.classList.remove('is-dragging');
        setTranslate(baseX, baseY, false);
      });

      // Onboarding
      const overlay = document.getElementById('onboardingOverlay');
      const ring = document.getElementById('spotlightRing');
      const titleEl = document.getElementById('onboardingTitle');
      const textEl = document.getElementById('onboardingText');
      const nextBtn = document.getElementById('onboardingNext');
      const skipBtn = document.getElementById('onboardingSkip');
      const replayBtn = document.getElementById('replayOnboarding');
      let stepIndex = 0;

      const steps = [
        { target: '.drag-handle', title: '拖动面板', text: '按住这里拖动面板，调整到你顺手的位置', action: '下一步' },
        { target: '#gestureHelp', title: '手势说明', text: '上下挥动=滚动，握拳=选中，张开手=打开', action: '下一步' },
        { target: '#actionChips', title: '自动执行', text: '看到对应手势后，面板会自动执行操作', action: '知道了' }
      ];

      function positionSpotlight(selector) {
        const target = document.querySelector(selector);
        if (!target || !mockup) return;
        const mockRect = mockup.getBoundingClientRect();
        const rect = target.getBoundingClientRect();
        ring.style.width = (rect.width + 8) + 'px';
        ring.style.height = (rect.height + 8) + 'px';
        ring.style.left = (rect.left - mockRect.left - 4) + 'px';
        ring.style.top = (rect.top - mockRect.top - 4) + 'px';
        ring.classList.add('is-active');
      }

      function renderStep(i) {
        const step = steps[i];
        titleEl.textContent = step.title;
        textEl.textContent = step.text;
        nextBtn.textContent = step.action;
        positionSpotlight(step.target);
      }

      function startOnboarding() {
        stepIndex = 0;
        overlay.classList.add('is-active');
        overlay.setAttribute('aria-hidden', 'false');
        renderStep(stepIndex);
      }

      function finishOnboarding() {
        overlay.classList.remove('is-active');
        overlay.setAttribute('aria-hidden', 'true');
        ring.classList.remove('is-active');
        try { localStorage.setItem('gesture-onboarding-shown', '1'); } catch (_) {}
      }

      nextBtn.addEventListener('click', function () {
        if (stepIndex < steps.length - 1) {
          stepIndex++;
          renderStep(stepIndex);
        } else {
          finishOnboarding();
        }
      });

      skipBtn.addEventListener('click', finishOnboarding);
      replayBtn.addEventListener('click', startOnboarding);

      try {
        if (localStorage.getItem('gesture-onboarding-shown') !== '1') {
          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', startOnboarding);
          } else {
            requestAnimationFrame(startOnboarding);
          }
        }
      } catch (_) {}
    })();
  </script>
  <script>lucide.createIcons();</script>
</body>
</html>
