<div class="gesture-panel collapsed" id="gesturePanel" role="region" aria-label="手势控制面板" aria-expanded="false">
  <!-- 折叠态悬浮条 -->
  <div class="collapsed-bar" id="collapsedBar">
    <span class="drag-handle" aria-label="拖动把手" role="button" tabindex="0">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="8" y1="9" x2="16" y2="9"></line>
        <line x1="8" y1="12" x2="16" y2="12"></line>
        <line x1="8" y1="15" x2="16" y2="15"></line>
      </svg>
    </span>
    <div class="collapsed-chips" id="collapsedChips">
      <span class="chip chip-ghost" data-action="open">打开</span>
      <span class="chip chip-ghost" data-action="select">选中</span>
      <span class="chip chip-ghost" data-action="scroll">滚动</span>
    </div>
    <button type="button" class="panel-toggle" id="expandToggle" aria-label="展开面板">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="7 15 12 20 17 15"></polyline>
        <polyline points="7 9 12 4 17 9"></polyline>
      </svg>
    </button>
    <button type="button" class="panel-exit" id="exitPanel" aria-label="退出面板">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <!-- 展开面板 -->
  <div class="expanded-content" id="expandedContent">
    <div class="expanded-header">
      <span class="drag-handle" aria-label="拖动把手" role="button" tabindex="0">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="8" y1="9" x2="16" y2="9"></line>
          <line x1="8" y1="12" x2="16" y2="12"></line>
          <line x1="8" y1="15" x2="16" y2="15"></line>
        </svg>
      </span>
      <span class="panel-title">手势控制</span>
      <button type="button" class="panel-toggle" id="collapseToggle" aria-label="收起面板">
        <svg class="icon icon-rotate-180" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="7 15 12 20 17 15"></polyline>
          <polyline points="7 9 12 4 17 9"></polyline>
        </svg>
      </button>
      <button type="button" class="panel-exit" id="exitPanelExpanded" aria-label="退出面板">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <div class="expanded-body">
      <div class="camera-status" id="cameraStatus">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="23 7 16 12 23 17 23 7"></polygon>
          <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
        </svg>
        <span class="status-dot" id="cameraDot" aria-hidden="true"></span>
        <span class="status-label" id="cameraLabel">摄像头 · 初始化</span>
      </div>
      <div class="section-divider" role="separator"></div>
      <div class="current-gesture" id="currentGesture">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"></path>
          <path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"></path>
          <path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"></path>
          <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.08-3.1a2 2 0 0 1 2.829-2.83L8 14"></path>
        </svg>
        <span class="gesture-label">当前手势</span>
        <span class="gesture-value" id="gestureValue">-</span>
      </div>
      <div class="expanded-chips" id="actionChips">
        <span class="chip chip-ghost" data-action="open">打开</span>
        <span class="chip chip-ghost" data-action="select">选中</span>
        <span class="chip chip-ghost" data-action="scroll">滚动</span>
      </div>
      <div class="gesture-help" id="gestureHelp">
        <p class="gesture-help-title">手势说明</p>
        <div class="gesture-help-row">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M7 16V3"></path>
            <path d="M11 11l-4 5-4-5"></path>
            <path d="M17 8v13"></path>
            <path d="M21 13l-4-5-4 5"></path>
          </svg>
          <span class="help-name">上下挥动</span>
          <span class="help-action">滚动</span>
        </div>
        <div class="gesture-help-row">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"></path>
            <path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"></path>
            <path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"></path>
            <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.08-3.1a2 2 0 0 1 2.829-2.83L8 14"></path>
          </svg>
          <span class="help-name">握拳</span>
          <span class="help-action">选中</span>
        </div>
        <div class="gesture-help-row">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"></path>
            <path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"></path>
            <path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"></path>
            <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.08-3.1a2 2 0 0 1 2.829-2.83L8 14"></path>
          </svg>
          <span class="help-name">张开手</span>
          <span class="help-action">打开</span>
        </div>
      </div>
      <button type="button" id="replayOnboarding" class="replay-btn">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="1 4 1 10 7 10"></polyline>
          <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
        </svg>
        重新引导
      </button>
    </div>
  </div>
</div>

<!-- 退出提示 -->
<div class="exit-toast" id="exitToast" role="status" aria-live="polite" aria-hidden="true">
  <span class="toast-text">已退出，5 秒后自动恢复</span>
  <button type="button" class="toast-restore" id="restorePanel">恢复面板</button>
</div>

<!-- 引导遮罩 -->
<div class="onboarding-overlay" id="onboardingOverlay" aria-hidden="true">
  <div class="spotlight-ring" id="spotlightRing"></div>
  <div class="onboarding-card">
    <p class="onboarding-title" id="onboardingTitle">欢迎使用手势面板</p>
    <p class="onboarding-text" id="onboardingText">...</p>
    <div class="onboarding-actions">
      <button type="button" id="onboardingSkip" class="onboarding-btn onboarding-btn-secondary">跳过</button>
      <button type="button" id="onboardingNext" class="onboarding-btn onboarding-btn-primary">下一步</button>
    </div>
  </div>
</div>
