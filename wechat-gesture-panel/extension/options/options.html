<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bilibili 手势面板选项</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
      background: #f2f5f7;
      color: #1f2937;
      max-width: 560px;
      margin: 48px auto;
      padding: 24px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 20px;
      font-weight: 600;
    }
    p {
      margin: 0 0 24px;
      font-size: 13px;
      color: #6b7b85;
    }
    label {
      display: block;
      margin: 16px 0 6px;
      font-size: 14px;
      font-weight: 500;
    }
    input[type="range"] { width: 100%; }
    .hint {
      font-size: 12px;
      color: #6b7b85;
      margin-top: 4px;
    }
    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 16px 0;
    }
    .check input { width: 16px; height: 16px; }
    .check label { margin: 0; }
    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 24px;
    }
    button {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      background: #6e9aa8;
      color: #ffffff;
      font-size: 14px;
      cursor: pointer;
      transition: opacity 150ms ease;
    }
    button:hover { opacity: 0.9; }
    .saved {
      font-size: 13px;
      color: #7db39a;
      opacity: 0;
      transition: opacity 200ms ease;
    }
    .saved.is-visible { opacity: 1; }
  </style>
</head>
<body>
  <h1>Bilibili 手势面板选项</h1>
  <p>调整手势识别灵敏度与开关状态，保存后刷新 Bilibili 页面生效。</p>

  <label for="sensitivity">手势灵敏度</label>
  <input type="range" id="sensitivity" min="0.1" max="1" step="0.1">
  <p class="hint">数值越高，手势越容易被触发。</p>

  <div class="check">
    <input type="checkbox" id="enabled">
    <label for="enabled">启用手势面板</label>
  </div>

  <div class="actions">
    <button id="save">保存</button>
    <span class="saved" id="saved">已保存</span>
  </div>

  <script src="options.js"></script>
</body>
</html>
